name: Cross-browser device profiles
# The owner's device checklist automated on WebKit (iPhone/iPad) and Chromium (Android) profiles. Emulation, not
# physical hardware (docs/V9-DEVICE-TESTING.md). Runs on pull requests that change the web app, and on demand.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['web/**', 'scripts/v9_*', '.github/workflows/device-profiles.yml']
permissions:
  contents: read
jobs:
  devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and the WebKit and Chromium engines
        run: |
          python -m pip install -e '.[dev]'
          npm --prefix web install --no-package-lock
          npm --prefix web install --no-save --package-lock=false playwright@1.56.1
          cd web && npx playwright install --with-deps webkit chromium
      - name: Build the offline review app from repository data (no API calls)
        run: node scripts/v9_preview.mjs
      - name: Device checklist on iPhone/iPad (WebKit) and Android (Chromium) profiles
        run: |
          mkdir -p web/device-evidence
          node web/tests/device-profiles.mjs web/device-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-profile-evidence
          path: web/device-evidence/
          retention-days: 30
