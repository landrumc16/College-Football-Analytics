name: V6 editorial before-and-after acceptance
on:
  push:
    branches: [v6-editorial-polish]
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/editorial-polish.yml'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard the released analytics, navigation, branding and PWA
        run: |
          # Baseline is the PR merge-base with main, so routine data refreshes on main are not attributed to the PR.
          guard_base="$(git merge-base "${{ github.event.pull_request.base.sha || '451f6107c24f0f240a84d1e31906bd2c2fcccad0' }}" HEAD)"
          echo "Guard baseline: $guard_base"
          # Strict byte-identical guard on every branch. The only exceptions are reviewed per-release manifests in
          # .github/release-manifests/: a same-repository PR whose head branch a manifest names may make exactly the
          # changes it lists (pinned files by SHA-256). Deletions/renames/other edits fail. Remove manifests after merge.
          python scripts/verify_protected_changes.py "$guard_base" "${{ github.head_ref }}" \
            "${{ github.event.pull_request.head.repo.full_name == github.repository }}" \
            -- src data research web/src/scenarios.ts web/src/scenario.worker.ts web/src/programMetrics.ts web/src/Navigation.tsx web/src/secondary-navigation.css web/src/EditorialHome.tsx web/public web/package.json
          # Scenario UI adds explicit analytics only. Its calculation engine and worker remain byte-identical above.
      - name: Stage the same real data for both visual builds
        run: |
          python -m pip install -e '.[dev]'
          python -m scripts.build_v6_product
          python -m cfb_analytics.backtest --output web/public/historical-backtest.json
          cp data/season-2026-report.json web/public/season-report.json
          cp data/poll-2026-snapshot.json web/public/poll-snapshot.json
          cp data/v2-research-summary.json web/public/v2-research-summary.json
          mkdir -p web/polish-evidence
          git rev-parse HEAD > web/polish-evidence/tested-sha.txt
          echo 70191e42df15f932733843df801a54de04847319 > web/polish-evidence/before-source-sha.txt
      - name: Install the existing frontend and browser test dependencies
        working-directory: web
        run: |
          npm install --no-package-lock
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture the released presentation with this same data
        run: |
          git checkout 70191e42df15f932733843df801a54de04847319 -- web/src
          npm --prefix web run build
          EDITORIAL_PHASE=before node web/tests/editorial-polish.mjs
      - name: Capture the refined presentation and verify exact behavior parity
        run: |
          git restore --source=HEAD --staged --worktree web/src
          npm --prefix web run build
          python scripts/verify_dashboard_bundle.py
          EDITORIAL_PHASE=after node web/tests/editorial-polish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-editorial-before-after-evidence
          path: web/polish-evidence/
          retention-days: 90
          if-no-files-found: error
