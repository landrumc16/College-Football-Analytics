name: V5 durable historical poll archive

on:
  workflow_dispatch:
  push:
    branches: [v5-development]
    paths:
      - 'scripts/archive_v5_historical_polls.py'
      - 'scripts/archive_v5_2025_polls.py'
      - 'research/v5-2025-preseason-polls-verified.json'
      - '.github/workflows/v5-archive-historical-polls.yml'
      - 'tests/test_v5_permanent_poll_archive.py'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5-development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive test dependencies
        run: python -m pip install pytest
      - name: Archive 2016–2024 poll snapshots and provenance
        run: python -m scripts.archive_v5_historical_polls --output research/archive/polls
      - name: Assemble separate 2025 authentic-preseason research archive
        run: python -m scripts.archive_v5_2025_polls
      - name: Verify complete archive offline
        run: python -m pytest -q tests/test_v5_permanent_poll_archive.py
      - name: Verify archived files against manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("research/archive/polls")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["publishable"] is False
          assert manifest["source_review_attested"] is False
          assert len(manifest["seasons"]) == 9
          assert manifest["excluded_seasons"] == [2025]
          for item in manifest["seasons"]:
              data = json.loads((root / item["path"]).read_text())
              assert data["season"] == item["season"]
              assert data["source_sha256"] == item["source_sha256"]
              assert data["source_url"] == item["source_url"]
              assert len(data["snapshots"]) == 4
              assert all(len(rows) == 25 for rows in data["snapshots"].values())
          newer = json.loads((root / "poll-snapshots-2025.json").read_text())
          assert newer["publishable"] is False
          assert newer["source_review_attested"] is False
          assert len(newer["snapshots"]) == 4
          assert newer["source_weeks"]["ap_preseason"] is None
          assert newer["source_weeks"]["coaches_preseason"] is None
          assert all(len(rows) == 25 for rows in newer["snapshots"].values())
          print("Research-only historical archive validated")
          PY
      - name: Commit immutable source snapshots to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/archive/polls
          if ! git diff --cached --quiet; then
            git commit -m "data(v5): retain 2016-2024 historical poll snapshots with provenance"
            git push origin HEAD:v5-development
          fi
