name: V2 historical evaluation checks

on:
  push:
    branches: [v2-development]
    paths:
      - 'src/cfb_analytics/historical*.py'
      - 'src/cfb_analytics/workbook_prediction.py'
      - 'src/cfb_analytics/paired_benchmark.py'
      - 'src/cfb_analytics/paired_cli.py'
      - 'tests/test_historical*.py'
      - 'tests/test_workbook_prediction.py'
      - 'tests/test_workbook_live_parity.py'
      - 'tests/test_paired_benchmark.py'
      - 'tests/test_paired_cli.py'
      - 'pyproject.toml'
      - '.github/workflows/v2-historical.yml'
  pull_request:
    paths:
      - 'src/cfb_analytics/historical*.py'
      - 'src/cfb_analytics/workbook_prediction.py'
      - 'src/cfb_analytics/paired_benchmark.py'
      - 'src/cfb_analytics/paired_cli.py'
      - 'tests/test_historical*.py'
      - 'tests/test_workbook_prediction.py'
      - 'tests/test_workbook_live_parity.py'
      - 'tests/test_paired_benchmark.py'
      - 'tests/test_paired_cli.py'
      - 'pyproject.toml'
      - '.github/workflows/v2-historical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Historical provenance and evaluation tests
        run: python -m pytest -q tests/test_historical_schema.py tests/test_historical_adapter.py tests/test_historical_evaluation.py tests/test_historical_cli.py
      - name: Full Python regression suite
        run: python -m pytest -q --junitxml=v2-pytest-results.xml
      - name: Preserve V2 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-pytest-results
          path: v2-pytest-results.xml
          if-no-files-found: warn
