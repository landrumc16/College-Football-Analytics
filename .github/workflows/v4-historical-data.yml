name: V4 historical source coverage

on:
  workflow_dispatch:
  push:
    branches: [v4-development]
    paths:
      - 'scripts/fetch_historical_schedules.py'
      - 'src/cfb_analytics/v4_source_integrity.py'
      - 'tests/test_v4_source_integrity.py'
      - '.github/workflows/v4-historical-data.yml'

permissions:
  contents: read

jobs:
  historical-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source reader
        run: python -m pip install pyarrow
      - name: Install project and run historical source integrity tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_v4_source_integrity.py
      - name: Fetch ten completed source seasons and compute checksums
        run: python scripts/fetch_historical_schedules.py --start-season 2016 --end-season 2025 --output historical-data
      - name: Generate chronology-safe retrospective Elo diagnostic
        run: python scripts/walkforward_baseline.py historical-data/games_20*.json --output historical-data
      - name: Validate extracted source coverage and provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          from cfb_analytics.v4_source_integrity import validate_season_games
          from pathlib import Path

          root = Path("historical-data")
          report = json.loads((root / "coverage.json").read_text())
          assert set(report["seasons"]) == {str(y) for y in range(2016, 2026)}
          for season, meta in sorted(report["seasons"].items()):
              source = root / f"cfb_schedules_{season}.parquet"
              extracted = root / f"games_{season}.json"
              rows = json.loads(extracted.read_text())
              assert source.is_file() and extracted.is_file()
              assert hashlib.sha256(source.read_bytes()).hexdigest() == meta["source_sha256"]
              assert hashlib.sha256(extracted.read_bytes()).hexdigest() == meta["extracted_sha256"]
              assert len(rows) == meta["extracted_games"]
              integrity = validate_season_games(rows, int(season))
              assert integrity["fbs_fbs"] == meta["completed_fbs_vs_fbs"]
              # The COVID-disrupted 2020 season had materially fewer games.
              # Retain it with explicit coverage rather than pretending it was normal.
              assert meta["completed_fbs_vs_fbs"] >= (400 if int(season) == 2020 else 700)
              assert meta["missing_fbs_kickoff"] == 0
              assert len({(r["season"], r["game_id"]) for r in rows}) == len(rows)
              assert all(r["season"] == int(season) for r in rows)
              print(f"{season}: {len(rows)} extracted completed FBS-participant games")
          predictions = json.loads((root / "walkforward_predictions.json").read_text())
          diagnostic = json.loads((root / "walkforward_report.json").read_text())
          assert len(predictions) == sum(v["completed_fbs_vs_fbs"] for v in report["seasons"].values())
          assert diagnostic["overall"]["games"] == len(predictions)
          assert set(diagnostic["by_season"]) == {str(y) for y in range(2016, 2026)}
          assert all(0 < p["home_probability"] < 1 for p in predictions)
          assert len({(p["season"], p["game_id"]) for p in predictions}) == len(predictions)
          print("Retrospective chronological Elo diagnostic verified; NOT frozen V3.4.2 or release-gate evidence")
          PY
      - name: Upload coverage manifest and extracted games
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-historical-source-coverage
          path: |
            historical-data/coverage.json
            historical-data/games_20*.json
            historical-data/walkforward_report.json
            historical-data/walkforward_predictions.json
          if-no-files-found: warn
          retention-days: 30
