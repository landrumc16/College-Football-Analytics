name: V6 live production acceptance
on:
  push:
    branches: [v6-production-verification]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DASHBOARD_URL: https://landrumc16.github.io/College-Football-Analytics/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 195fbd143df002b733a4f36e6030b5677a9f19d4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare production-matched inputs and verify incumbent identity
        run: |
          python -m pip install -e '.[dev]'
          python -m scripts.build_v6_product
          mkdir -p web/v6-evidence
          git rev-parse HEAD > web/v6-evidence/production-sha.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          baseline=json.loads(Path('research/v6/incumbent-baseline.json').read_text())
          for p in ['src/cfb_analytics/model.py','src/cfb_analytics/pipeline.py','src/cfb_analytics/predictions.py']:
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==baseline['files'][p]
          PY
      - name: Wait for the refined Pages application to become available
        run: |
          python - <<'PY'
          import os,time,json,hashlib,re
          from urllib.parse import urljoin
          from urllib.request import Request,urlopen
          base=os.environ['DASHBOARD_URL']
          for attempt in range(24):
              try:
                  report=urlopen(Request(base+'season-report.json',headers={'Cache-Control':'no-cache'}),timeout=30).read()
                  packet=json.load(urlopen(Request(base+'v6-scenario-input.json',headers={'Cache-Control':'no-cache'}),timeout=30))
                  html=urlopen(Request(base+'?release=195fbd1',headers={'Cache-Control':'no-cache'}),timeout=30).read().decode()
                  script=re.search(r'<script[^>]+src="([^"]+)"',html).group(1)
                  js=urlopen(urljoin(base,script),timeout=30).read().decode()
                  if 'Verified pregame picks' in js and 'THE PROGRAM FILE' in js and packet['report_sha256']==hashlib.sha256(report).hexdigest():
                      print('Refined live application and report/scenario identity confirmed');break
              except Exception as error:
                  print(type(error).__name__)
              time.sleep(10)
          else:raise RuntimeError('Refined production application did not become ready')
          PY
      - name: Verify actual public data, freshness and non-promotion
        run: |
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          from urllib.request import Request,urlopen
          base=os.environ['DASHBOARD_URL']
          names=['index.html','season-report.json','v6-scenario-input.json','v6-program-context.json','v6-prediction-research.json','manifest.webmanifest','sw.js']
          evidence={};data={}
          for name in names:
              with urlopen(Request(base+name,headers={'Cache-Control':'no-cache'}),timeout=40) as r:
                  b=r.read();assert r.status==200
              evidence[name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
              if name.endswith('.json'):data[name]=json.loads(b)
          report=data['season-report.json'];scenario=data['v6-scenario-input.json'];research=data['v6-prediction-research.json']
          assert report['model_metadata']['model_id']=='workbook_2026_baseline'
          assert report['model_metadata']['model_status']=='incumbent_not_v3_promoted'
          assert scenario['report_sha256']==evidence['season-report.json']['sha256']
          assert research['model_status']=='experimental_not_promoted'
          assert research['promotion']['incumbent_retained'] is True
          assert research['promotion']['eligible'] is False and research['promotion']['authorized'] is False
          for name in ['v6-program-context.json','v6-prediction-research.json']:
              assert evidence[name]['sha256']==hashlib.sha256((Path('web/public')/name).read_bytes()).hexdigest()
          from datetime import datetime,timezone,timedelta
          updated=datetime.fromisoformat(report['retrieved_at'].replace('Z','+00:00'))
          assert -timedelta(hours=1)<=datetime.now(timezone.utc)-updated<=timedelta(hours=72)
          evidence['model_metadata']=report['model_metadata'];evidence['retrieved_at']=report['retrieved_at'];evidence['production_url']=base
          Path('web/v6-evidence/public-assets.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence))
          PY
      - name: Install browser acceptance dependencies
        working-directory: web
        run: |
          npm install --no-package-lock
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Point the existing acceptance harness at production without changing application code
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/tests/v6-browser.mjs');s=p.read_text()
          assert "const server=spawn(" in s and "const url='http://127.0.0.1:4180/'" in s
          s=s.replace('const server=spawn(', 'const server=process.env.DASHBOARD_URL ? null : spawn(',1)
          s=s.replace("const url='http://127.0.0.1:4180/'", "const url=process.env.DASHBOARD_URL || 'http://127.0.0.1:4180/'",1)
          old="try{process.kill(-server.pid,'SIGTERM')}catch{server.kill()}"
          assert old in s;s=s.replace(old,"if(server){"+old+"}",1)
          s=s.replace('await page.screenshot({path:`web/v6-evidence/research-', 'await research.scrollIntoViewIfNeeded();await page.screenshot({path:`web/v6-evidence/research-',1)
          p.write_text(s)
          PY
      - name: Exercise actual live program context, research and scenarios at all five widths
        run: node web/tests/v6-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-live-production-evidence
          path: web/v6-evidence/
          retention-days: 90
          if-no-files-found: error
