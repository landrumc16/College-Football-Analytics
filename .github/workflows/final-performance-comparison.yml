name: Final paired scenario performance verification
on:
  push:
    branches: [public-beta-analytics]
    paths: ['.github/workflows/final-performance-comparison.yml']
permissions:
  contents: read
jobs:
  paired-original-gate:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stage identical publication and build both exact sources
        env:
          PLAYWRIGHT_VERSION: 1.56.1
        run: |
          python -m pip install -e '.[dev]'
          npm --prefix web install --no-package-lock
          npm --prefix web install --no-save --package-lock=false "playwright@$PLAYWRIGHT_VERSION"
          (cd web && npx playwright install --with-deps chromium)
          python -m scripts.build_v6_product
          python -m cfb_analytics.backtest --output web/public/historical-backtest.json
          cp data/season-2026-report.json web/public/season-report.json
          cp data/poll-2026-snapshot.json web/public/poll-snapshot.json
          cp data/v2-research-summary.json web/public/v2-research-summary.json
          git worktree add --detach /tmp/cfa-performance-baseline 451f6107c24f0f240a84d1e31906bd2c2fcccad0
          ln -s "$GITHUB_WORKSPACE/web/node_modules" /tmp/cfa-performance-baseline/web/node_modules
          cp web/public/*.json /tmp/cfa-performance-baseline/web/public/
          npm --prefix /tmp/cfa-performance-baseline/web run build
          npm --prefix web run build
          git diff --exit-code 451f6107c24f0f240a84d1e31906bd2c2fcccad0 HEAD -- web/src/scenarios.ts web/src/scenario.worker.ts research/v6/scenario-python-fixtures.json web/tests/v6-browser.mjs

      - name: Run the complete regression predecessors before measuring
        run: |
          node web/tests/analytics-unit.mjs
          node web/tests/historical-publication.mjs
          node web/tests/v6-scenarios.mjs
          node web/tests/mobile-smoke.mjs
          node web/tests/editorial-home.mjs
      - name: Run unchanged acceptance test in paired ABBA order without retries
        run: |
          mkdir -p performance-evidence
          python - <<'PY'
          import json, os, platform, re, subprocess
          print(subprocess.check_output(['node','-e',"console.log(JSON.stringify({node:process.version,cpus:require('os').cpus().map(c=>({model:c.model,speed:c.speed}))}))"],text=True),flush=True)
          from pathlib import Path
          root=Path.cwd()
          baseline=Path('/tmp/cfa-performance-baseline')
          version=subprocess.check_output(['node','-p',"require('./web/node_modules/playwright/package.json').version"],text=True).strip()
          rows=[]
          # Every original assertion remains active, including the 3000 ms limit.
          for index,(label,cwd) in enumerate([('production',baseline),('candidate',root),('candidate',root),('production',baseline)],1):
              result=subprocess.run(['node','web/tests/v6-browser.mjs'],cwd=cwd,capture_output=True,text=True)
              output=result.stdout+result.stderr
              (root/'performance-evidence'/f'{index}-{label}.log').write_text(output)
              print('\n'.join(line for line in output.splitlines() if line.startswith('RENDERER_DIAGNOSTIC ')),flush=True)
              match=re.search(r'budget exceeded: ([0-9.]+) ms',output)
              timing=float(match.group(1)) if match else None
              if result.returncode==0:
                  records=json.loads(result.stdout.strip().splitlines()[-1])
                  timing=next(r['benchmarkMs4x'] for r in records if r['width']==390)
              row={'order':index,'source':label,'sha':subprocess.check_output(['git','rev-parse','HEAD'],cwd=cwd,text=True).strip(),'exitCode':result.returncode,'milliseconds4x':timing,'limitMs':3000}
              rows.append(row)
              print(json.dumps(row),flush=True)
          receipt={'setup':'full regression predecessors; pinned Ubuntu 24.04 and Playwright 1.56.1; unchanged cold algorithm gate','os':platform.platform(),'playwrightVersion':version,'cpuThrottle':4,'viewport':[390,844],'draws':2000,'originalTest':'web/tests/v6-browser.mjs','order':'ABBA','retries':0,'allOriginalAssertionsPreserved':True,'rows':rows,'status':'PASS' if all(r['exitCode']==0 for r in rows) else 'FAIL'}
          (root/'performance-evidence/results.json').write_text(json.dumps(receipt,indent=2)+'\n')
          if receipt['status']!='PASS':raise SystemExit('Original acceptance gate failed; do not merge.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-paired-performance-trial-${{ matrix.trial }}
          path: performance-evidence/
          if-no-files-found: error
          retention-days: 90
