name: V8 source acquisition (CFBD games, drives, plays)
# Development only (v8-development). Uses the existing CFBD_API_KEY secret. Raw CFBD responses stay in
# the owner's PRIVATE snapshot repository when CFBD_SNAPSHOT_TOKEN is configured (same store as V7),
# otherwise only in the runner's temporary workspace. Only derived per team-game counts are committed.
# Never runs on pull requests, so fork workflows cannot reach the secrets.
on:
  push:
    branches: [v8-development]
    paths:
      - 'src/cfb_analytics/v8_sources.py'
      - 'tests/test_v8_sources.py'
      - '.github/workflows/v8-sources.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v8-sources
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/v8-development'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      HAS_STORE: ${{ secrets.CFBD_SNAPSHOT_TOKEN != '' }}
      SNAPSHOT_REPO: ${{ vars.CFBD_SNAPSHOT_REPO || 'landrumc16/cfb-analytics-private-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Derivation fixture tests
        run: python -m pytest -q tests/test_v8_sources.py
      - name: Restore private snapshot store (must be private)
        if: env.HAS_STORE == 'true'
        env:
          TOKEN: ${{ secrets.CFBD_SNAPSHOT_TOKEN }}
        run: |
          visibility=$(curl -sS -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$SNAPSHOT_REPO" | python -c "import json,sys; print(json.load(sys.stdin).get('visibility'))")
          if [ "$visibility" != "private" ] && [ "$visibility" != "internal" ]; then echo "snapshot store not private ($visibility)"; exit 1; fi
          git clone -q "https://x-access-token:${TOKEN}@github.com/${SNAPSHOT_REPO}.git" private-store 2>&1 | sed "s/${TOKEN}/***/g"
          echo "STORE=$GITHUB_WORKSPACE/private-store/v8-cfbd" >> "$GITHUB_ENV"
      - name: Temporary store when no private store is configured
        if: env.HAS_STORE != 'true'
        run: |
          echo "STORE=$RUNNER_TEMP/v8-cfbd" >> "$GITHUB_ENV"
          echo "::warning::CFBD_SNAPSHOT_TOKEN missing; raw snapshots are temporary for this run"
      - name: Acquire 2016-2026 and derive per team-game counts (field names diagnostics only)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m cfb_analytics.v8_sources --seasons 2016-2026 --refresh 2026 --cache "$STORE" --diagnose
      - name: Offline re-derivation from the snapshots is byte-identical
        run: |
          cp -r research/v8/team-games "$RUNNER_TEMP/first"
          python -m cfb_analytics.v8_sources --seasons 2016-2026 --cache "$STORE" --offline
          diff -r "$RUNNER_TEMP/first" research/v8/team-games && echo "offline re-derivation identical"
      - name: Leak scan (no raw provider rows, play text or credentials in public outputs)
        run: |
          python - <<'PY'
          import gzip, pathlib, sys
          bad = []
          for f in sorted(pathlib.Path("research/v8").rglob("*")):
              if f.is_dir():
                  continue
              text = gzip.decompress(f.read_bytes()).decode() if f.suffix == ".gz" else f.read_text()
              bad += [f"{f}: {m}" for m in ("playText", "play_text", "wallclock", "ghp_", "github_pat_", "x-access-token") if m in text]
          if bad:
              sys.exit("LEAK SCAN FAILED: " + "; ".join(bad[:10]))
          print("leak scan passed")
          PY
      - name: Commit derived outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v8/team-games research/v8/fbs-membership.json research/v8/sources-receipt.json
          if git status --porcelain | grep -vE '^(M |A ) research/v8/(team-games/[0-9]{4}\.json\.gz|fbs-membership\.json|sources-receipt\.json)$'; then
            echo "unexpected files changed; refusing to commit"; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "V8 M1: derived per team-game counts from CFBD (2016-2026)"
            git pull --rebase origin v8-development
            git push origin HEAD:v8-development
          fi
      - name: Save snapshots to the private store
        if: env.HAS_STORE == 'true'
        working-directory: private-store
        env:
          TOKEN: ${{ secrets.CFBD_SNAPSHOT_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v8-cfbd
          if ! git diff --cached --quiet; then
            git commit -q -m "CFBD V8 snapshots (run ${GITHUB_RUN_ID})"
            git push -q origin HEAD:main 2>&1 | sed "s/${TOKEN}/***/g"
          fi
