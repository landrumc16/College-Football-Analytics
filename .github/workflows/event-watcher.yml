name: Event-driven game-day watcher
# The calendar says when to look, the source says when to act, the live site confirms publication.
# Scheduled starts only need to land once per window: a run watches continuously (up to ~6 hours) and later starts
# queue behind it, so GitHub dropping most cron starts no longer delays results. Idle hours exit in seconds without
# calling CFBD. The real-provider integration check is a manual dry run (workflow_dispatch, dry_run: true): each
# costs about three CFBD calls, so it is not run on every push. See docs/EVENT-DRIVEN-DATA.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check every real provider once and dispatch nothing
        type: boolean
        default: false
  schedule:
    - cron: '7 * * 8-12 *'
    - cron: '7 * * 1 *'

permissions:
  contents: write
  actions: write      # workflow_dispatch of the refresh workflows and of the next watcher run (allowed from GITHUB_TOKEN)
  issues: write       # freshness alert issue

# One running and at most one queued run: each run queues its successor when it starts (watcher chain), so chained,
# scheduled and keeper-started runs never overlap. The schedule above is only a backup for a stopped chain.
concurrency:
  group: event-watcher
  cancel-in-progress: false

env:
  CFBD_SHARED_QUOTA: github
  CFBD_ACQUISITION_LIMIT: '400'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Watch (or one real-provider dry run when requested)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m cfb_analytics.event_watcher --dry-run
          else
            python -m cfb_analytics.event_watcher --minutes 350
          fi
      - name: Keep the event watcher running and report freshness problems
        # GitHub can start scheduled runs hours late, so every run of this workflow also restarts a stopped watcher
        # chain (never a second concurrent watcher) and runs one freshness monitor pass. No CFBD calls.
        if: always() && github.ref == 'refs/heads/main' && inputs.dry_run != true
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m cfb_analytics.watch_keeper
      - name: Keep the event ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-ledger
          path: event-ledger.json
          if-no-files-found: ignore
          retention-days: 30
