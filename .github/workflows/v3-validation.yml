name: V3 research validation

on:
  push:
    branches: [v3-development]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/v3-validation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Full Python regression suite
        run: PYTHONPATH=. python -m pytest -q
      - name: Verify V3 CLI interface
        run: python -m cfb_analytics.v3_cli --help
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend build regression
        working-directory: web
        run: |
          npm install
          npm run build
