name: Multiple-source lifecycle acceptance
on:
  pull_request:
  push:
    branches: [fix/multisource-lifecycle]
permissions:
  contents: read
jobs:
  offline-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Exercise intake, publication, reconciliation, archives and watcher offline
        run: python -m pytest -q tests/test_rapid_results.py tests/test_rapid_monitor.py tests/test_v5_fast_updates.py tests/test_v5_fast_updates_cli.py tests/test_event_driven.py
