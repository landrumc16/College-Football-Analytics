name: V7 historical market archive backfill
# Development only (v7-development). Uses the existing CFBD_API_KEY secret.
# Raw CFBD snapshots are retained only in the owner's PRIVATE snapshot repository (secret
# CFBD_SNAPSHOT_TOKEN: fine-grained token, Contents read/write on that one repository). Without it
# they live only in the runner's temporary workspace. Raw data is never committed to this public
# repository, uploaded as artifacts, cached or printed. Runs only on pushes to v7-development
# (never on pull requests), so fork workflows cannot reach the token.
on:
  push:
    branches: [v7-development]
    paths:
      - 'src/cfb_analytics/v7_market_archive.py'
      - 'tests/test_v7_market_archive.py'
      - 'src/cfb_analytics/v7_market_metrics.py'
      - 'tests/test_v7_market_metrics.py'
      - 'src/cfb_analytics/v7_validation.py'
      - 'tests/test_v7_validation.py'
      - '.github/workflows/v7-market-backfill.yml'
  workflow_dispatch:
    inputs:
      accept_upstream_change:
        description: Accept reviewed upstream CFBD historical changes
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: v7-market-archive
  cancel-in-progress: false
env:
  CFBD_SHARED_QUOTA: github
  CFBD_ACQUISITION_LIMIT: '8'

jobs:
  backfill:
    if: github.ref == 'refs/heads/v7-development'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HAS_STORE: ${{ secrets.CFBD_SNAPSHOT_TOKEN != '' }}
      SNAPSHOT_REPO: ${{ vars.CFBD_SNAPSHOT_REPO || 'landrumc16/cfb-analytics-private-data' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the snapshot repository is reachable and private
        if: env.HAS_STORE == 'true'
        env:
          TOKEN: ${{ secrets.CFBD_SNAPSHOT_TOKEN }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/repo.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$SNAPSHOT_REPO")
          python - "$code" <<'PY'
          import json, os, sys
          code = sys.argv[1]
          if code != "200":
              sys.exit(f"snapshot repository not reachable with CFBD_SNAPSHOT_TOKEN (HTTP {code})")
          repo = json.load(open(os.environ["RUNNER_TEMP"] + "/repo.json"))
          if repo.get("private") is not True or repo.get("visibility") not in ("private", "internal"):
              sys.exit("snapshot repository is not private; refusing to store provider data")
          print(f"Snapshot repository reachable; private={repo['private']} visibility={repo['visibility']} empty={repo.get('size', 0) == 0}")
          PY
          rm -f "$RUNNER_TEMP/repo.json"
      - name: Restore durable private snapshot store
        if: env.HAS_STORE == 'true'
        env:
          TOKEN: ${{ secrets.CFBD_SNAPSHOT_TOKEN }}
        run: |
          # A plain clone also works for a brand-new empty repository (actions/checkout does not).
          git clone -q "https://x-access-token:${TOKEN}@github.com/${SNAPSHOT_REPO}.git" private-store 2>&1 | sed "s/${TOKEN}/***/g"
          test -d private-store/.git
      - name: Select snapshot location
        run: |
          if [ "$HAS_STORE" = "true" ]; then
            echo "STORE=$GITHUB_WORKSPACE/private-store/v7-cfbd-lines" >> "$GITHUB_ENV"
            echo "Durable private snapshot store: restored ($(ls private-store/v7-cfbd-lines 2>/dev/null | grep -c '\.meta\.json$' || true) snapshots)"
          else
            echo "STORE=$RUNNER_TEMP/v7-private" >> "$GITHUB_ENV"
            echo "::warning::Durable private snapshot store not configured (CFBD_SNAPSHOT_TOKEN missing); snapshots are temporary for this run"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Full regression suite (committed V7 outputs are re-verified after regeneration below)
        run: python -m pytest -q -k "not committed"
      - name: Dispute diagnostics (aggregate counts only; populates private runner cache)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m cfb_analytics.v7_market_archive --diagnose --backfill 2016-2025 --cache "$STORE"
      - name: Full rebuild 2016-2025 plus current season (history restored from the private store when present)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ACCEPT: ${{ github.event.inputs.accept_upstream_change == 'true' && '--accept-upstream-change' || '' }}
        run: python -m cfb_analytics.v7_market_archive --backfill 2016-2025 --season 2026 --cache "$STORE" $ACCEPT
      - name: Offline regeneration from private snapshots is byte-identical
        run: python -m cfb_analytics.v7_market_archive --check --season 2026 --cache "$STORE"
      - name: Incremental current-season refresh reproduces the full rebuild (2 calls, no history download)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp web/public/v7-team-market-history.json "$RUNNER_TEMP/full.json"
          python -m cfb_analytics.v7_market_archive --season 2026 --cache "$STORE"
          python - <<'PY'
          import json, os
          full = json.load(open(os.environ["RUNNER_TEMP"] + "/full.json"))
          inc = json.load(open("web/public/v7-team-market-history.json"))
          assert inc["teams"] == full["teams"] and inc["coverage"] == full["coverage"], "incremental differs from full rebuild"
          print("incremental == full rebuild for", len(inc["teams"]), "teams")
          PY
      - name: Independent hand-check and Texas Tech reconciliation (outcome letters only, no line values)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from cfb_analytics import v7_market_archive as m
          cache = Path(os.environ["STORE"])
          ids = {"400869627": 2016, "400869100": 2016, "400869359": 2016, "400869625": 2016, "400869598": 2016}
          checked = 0
          for season in (2016, 2020, 2025):
              rows = json.loads((cache / f"{season}-regular.json").read_text()) + json.loads((cache / f"{season}-postseason.json").read_text())
              results = m.historical_results([season])
              outcomes = {o["game_id"]: o for o in m.build_season(season, rows, results)[0]}
              picks = [g for g in ids if ids[g] == season] or [g for g in sorted(outcomes) if outcomes[g]["spread_status"] == "ok"][:4]
              for gid in picks:
                  o, r = outcomes[gid], results[gid]
                  row = next(x for x in rows if str(x["id"]) == gid)
                  # Independent recomputation: priority provider by hand, explicit orientation, plain arithmetic.
                  provs = {l["provider"]: l for l in row["lines"]}
                  known = [p for p in m.PROVIDER_PRIORITY if p in provs and provs[p].get("spread") is not None]
                  order = known + sorted(p for p in provs if provs[p].get("spread") is not None and p not in known)
                  if not order:
                      assert o["spread_status"] == "no_line"; checked += 1; continue
                  # Independent policy-v2 sole-outlier rule: replace the priority choice only if >= 2 others agree
                  # within 3 points and it is >= 3 points from their median.
                  vals = [float(provs[p]["spread"]) for p in order]
                  rest = sorted(vals[1:])
                  med = (rest[len(rest) // 2] if len(rest) % 2 else (rest[len(rest) // 2 - 1] + rest[len(rest) // 2]) / 2) if rest else None
                  if len(rest) >= 2 and rest[-1] - rest[0] < 3 and abs(vals[0] - med) >= 3:
                      order = order[1:]
                  spread = float(provs[order[0]]["spread"])
                  if m.ALIASES.get(row["homeTeam"], row["homeTeam"]) != r["home"]:
                      spread = -spread
                  cover = (r["home_score"] - r["away_score"]) + spread
                  expect = "W" if cover > 0 else "L" if cover < 0 else "P"
                  assert o["spread_provider"] == order[0], gid
                  if o["spread_status"] in ("ok", "disputed"):
                      assert o["home_ats"] == expect, gid
                  print(f"handcheck {season} {gid} {r['away']} at {r['home']}: provider={order[0]} status={o['spread_status']} home_ats={o.get('home_ats')} ou={o.get('ou')} PASS")
                  checked += 1
          assert checked >= 10, checked
          pub = json.load(open("web/public/v7-team-market-history.json"))
          ttu = pub["teams"]["Texas Tech"]
          total = {k: sum(b["ats"][k] for b in ttu["by_season"].values()) for k in "wlp"}
          assert total == ttu["overall"]["ats"], (total, ttu["overall"]["ats"])
          ou = {k: sum(b["ou"][k] for b in ttu["by_season"].values()) for k in "oup"}
          assert ou == ttu["overall"]["ou"]
          print("Texas Tech overall ATS", ttu["overall"]["ats"], "O/U", ttu["overall"]["ou"], "reconciles with per-season records")
          PY
      - name: M3 metrics from the regenerated archive (recount must equal the archive; authentic forecasts only)
        run: |
          python -m cfb_analytics.v7_market_metrics
          python -m cfb_analytics.v7_market_metrics --check
      - name: M6 historical validation (archive integrity, authentic-only model vs market; aggregates only)
        run: |
          python -m cfb_analytics.v7_validation
          python -m cfb_analytics.v7_validation --check
      - name: Licensing guard and committed-output tests
        run: python -m pytest -q tests/test_v7_market_archive.py tests/test_v7_market_metrics.py tests/test_v7_validation.py
      - name: Commit derived public outputs and receipts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v7-market-receipts.json web/public/v7-team-market-history.json web/public/v7-team-lines \
            web/public/v7-market-metrics.json web/public/v7-model-market research/v7/historical-validation.json
          if git status --porcelain | grep -vE '^(M |A |D ) (data/v7-market-receipts.json|research/v7/historical-validation.json|web/public/v7-team-market-history.json|web/public/v7-market-metrics.json|web/public/v7-(team-lines|model-market)/[a-z0-9-]+\.json)$'; then
            echo "unexpected files changed; refusing to commit"; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "V7 M2: derived historical market archive from CFBD backfill"
            git push origin HEAD:v7-development
          fi
      - name: Save validated snapshots to the durable private store
        if: env.HAS_STORE == 'true'
        working-directory: private-store
        env:
          TOKEN: ${{ secrets.CFBD_SNAPSHOT_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v7-cfbd-lines
          if ! git diff --cached --quiet; then
            git commit -q -m "CFBD /lines snapshots (validated by College-Football-Analytics run ${GITHUB_RUN_ID})"
            git push -q origin HEAD:main 2>&1 | sed "s/${TOKEN}/***/g"
          fi
          echo "Private store holds $(ls v7-cfbd-lines | grep -c '\.meta\.json$') snapshots at $(git rev-parse --short HEAD)"
      - name: Verify durable restore from a fresh private clone (offline, byte-identical)
        if: env.HAS_STORE == 'true'
        env:
          TOKEN: ${{ secrets.CFBD_SNAPSHOT_TOKEN }}
        run: |
          git clone -q "https://x-access-token:${TOKEN}@github.com/${SNAPSHOT_REPO}.git" private-store-verify 2>&1 | sed "s/${TOKEN}/***/g"
          echo "Fresh private clone holds $(ls private-store-verify/v7-cfbd-lines | grep -c '\.meta\.json$') snapshots"
      - name: Regenerate public outputs from the fresh private clone without downloading
        if: env.HAS_STORE == 'true'
        run: python -m cfb_analytics.v7_market_archive --check --season 2026 --cache private-store-verify/v7-cfbd-lines
      - name: Leak scan - no raw provider data, snapshots or credentials in public outputs or the public index
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          bad = []
          raw_markers = ("formattedSpread", "spreadOpen", "overUnderOpen", "homeMoneyline", "awayMoneyline", "\"lines\":[")
          public = [pathlib.Path("data/v7-market-receipts.json"), pathlib.Path("web/public/v7-team-market-history.json"),
                    *sorted(pathlib.Path("web/public/v7-team-lines").glob("*.json")),
                    pathlib.Path("web/public/v7-market-metrics.json"), pathlib.Path("research/v7/historical-validation.json"), *sorted(pathlib.Path("web/public/v7-model-market").glob("*.json"))]
          for f in public:
              text = f.read_text()
              bad += [f"{f}: {m}" for m in raw_markers if m in text]
              bad += [f"{f}: credential-like string" for m in ("ghp_", "github_pat_", "x-access-token") if m in text]
          tracked = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.splitlines()
          bad += [f"tracked private path: {t}" for t in tracked if t.startswith(("private-store", "v7-cfbd-lines")) or "/v7-cfbd-lines/" in t]
          for f in pathlib.Path("web/public/v7-team-lines").glob("*.json"):
              for g in json.loads(f.read_text())["games"]:
                  if not all(isinstance(g.get(k), (str, type(None))) for k in ("spread_provider", "total_provider")):
                      bad.append(f"{f}: provider is not a single name")
          if bad:
              sys.exit("LEAK SCAN FAILED:\n" + "\n".join(bad[:20]))
          print(f"Leak scan passed: {len(public)} public files, {len(tracked)} tracked paths; no raw provider fields, snapshots or credentials")
          PY
