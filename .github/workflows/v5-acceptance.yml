name: V5 development acceptance checks

on:
  push:
    branches: [v5-development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and tests
        run: python -m pip install -e '.[dev]'
      - name: Run full Python regression suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Compile and build V5 app
        working-directory: web
        run: npm run build
      - name: Check PWA assets and poll snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('web/dist')
          assert (d/'index.html').exists()
          assert (d/'manifest.webmanifest').exists()
          assert (d/'sw.js').exists()
          manifest=json.loads((d/'manifest.webmanifest').read_text())
          assert manifest['display']=='standalone'
          snapshot=json.loads(Path('data/poll-2026-snapshot.json').read_text())
          for key in ('ap_top25','coaches_top25','cfp_top25'):
              if key in snapshot:
                  rows=snapshot[key]
                  assert len(rows)==25, key
                  assert {r['rank'] for r in rows}==set(range(1,26)), key
                  assert len({r['team'] for r in rows})==25, key
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-frontend-build
          path: web/dist/
          retention-days: 7
          if-no-files-found: warn
