name: Build and publish analytics dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh college football data']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'data/season-*-report.json'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build frozen-data demo if live report absent
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
          if [ ! -f data/season-2026-report.json ]; then
            python -m cfb_analytics.demo
          fi
          test -f data/season-2026-report.json || test -s web/public/season-report.json
      - name: Execute historical prediction backtest
        run: |
          python -m cfb_analytics.backtest --output historical-backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("historical-backtest.json").read_text())
          assert result["games"] > 0, "No historical games evaluated"
          for label in ("model", "preseason_baseline"):
              scores = result[label]
              assert 0 <= scores["winner_accuracy"] <= 1, label
              assert 0 <= scores["brier_score"] <= 1, label
              assert scores["log_loss"] >= 0, label
          print("Historical games evaluated:", result["games"])
          print("Model:", result["model"])
          print("Preseason baseline:", result["preseason_baseline"])
          PY
      - name: Upload historical backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-results
          path: historical-backtest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Spreadsheet numerical parity audit (diagnostic)
        run: |
          # Keep an auditable discrepancy report without blocking the dashboard
          # until the frozen week-7 baseline has been reconciled.
          set -o pipefail
          if python -m cfb_analytics.parity --strict --tolerance 0.001 2>&1 | tee parity-report.txt; then
            echo "Spreadsheet numerical parity passed."
          else
            echo "::warning::Spreadsheet numerical parity is not yet verified; see parity-report artifact."
          fi
      - name: Upload spreadsheet parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spreadsheet-parity-report
          path: parity-report.txt
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Publish historical backtest evidence
        run: |
          test -s historical-backtest.json
          cp historical-backtest.json web/dist/historical-backtest.json
      - name: Include and validate published season report
        run: |
          if [ -f data/season-2026-report.json ]; then
            cp data/season-2026-report.json web/dist/season-report.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("web/dist/season-report.json").read_text())
          assert report["season"] == 2026, "Only the 2026 season is supported"
          assert report["summary"]["teams"] == len(report["rankings"])
          assert report["summary"]["upcoming_games"] == len(report["predictions"])
          assert report["rankings"] and report["predictions"]
          if "schedule" in report:
            ids = {g["game_id"] for g in report["schedule"]}
            assert len(ids) == len(report["schedule"]), "Duplicate schedule games"
            # The school schedule is FBS-filtered; predictions also include games outside that subset.
          assert all("game_id" in p for p in report["predictions"]), "Forecast missing game ID"
          if "performance" in report:
            assert len(report["performance"]) == report["summary"]["teams"]
            for team, row in report["performance"].items():
              assert row["games_with_forecasts"] >= 0, team
              if row["games_with_forecasts"] == 0:
                assert row["wins_above_expected"] is None, team
              else:
                assert 0 <= row["expected_wins"] <= row["games_with_forecasts"], team
          # Never silently label a frozen fixture as a current CFBD report.
          source = report.get("source") or ""
          assert source, "Report source must be identified"
          if "${{ github.event_name }}" == "workflow_run":
            assert "DEMO" not in source, "A successful live refresh must not deploy demo data"
          if "DEMO" not in source:
            from datetime import datetime
            assert "collegefootballdata.com" in source, "Unknown live report source"
            retrieved_at = report.get("retrieved_at")
            assert retrieved_at, "Live report requires retrieval timestamp"
            datetime.fromisoformat(retrieved_at.replace("Z", "+00:00"))
          assert report["cfp"]["simulations"] == 10000
          assert report["cfp"]["scenario"] == "current_model_probabilities"
          assert len(report["cfp"]["teams"]) == report["summary"]["teams"]
          assert len(report["projected_bracket"]["seeds"]) == 12
          assert len(report["projected_bracket"]["first_round"]) == 4
          assert sum(seed["bye"] for seed in report["projected_bracket"]["seeds"]) == 4
          assert report["conference_standings"]
          assert report["conference_strength"]
          assert all("most_likely_seed" in team for team in report["cfp"]["teams"])
          assert all("average_seed_when_selected" in team for team in report["cfp"]["teams"])
          if "prediction_accuracy" in report:
            accuracy = report["prediction_accuracy"]
            assert isinstance(accuracy["games_evaluated"], int) and accuracy["games_evaluated"] >= 0
            assert 0 <= accuracy["correct_winners"] <= accuracy["games_evaluated"]
            if accuracy["games_evaluated"]:
              assert 0 <= accuracy["winner_accuracy"] <= 1
              assert 0 <= accuracy["brier_score"] <= 1
            else:
              assert accuracy["winner_accuracy"] is None and accuracy["brier_score"] is None
          backtest = json.loads(Path("web/dist/historical-backtest.json").read_text())
          assert backtest["games"] > 0
          assert sum(row["games"] for row in backtest["weekly_coverage"]) == backtest["games"]
          assert backtest["evaluation_scope"].startswith("2026 frozen")
          assert Path("web/dist/index.html").is_file()
          print("Validated published dashboard and report")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published dashboard
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error "$base" -o /tmp/cfb-index.html && \
               curl --fail --location --silent --show-error "${base}season-report.json" -o /tmp/cfb-report.json && \
               curl --fail --location --silent --show-error "${base}historical-backtest.json" -o /tmp/cfb-backtest.json; then
              python - <<'PY'
          import json
          from pathlib import Path
          html = Path("/tmp/cfb-index.html").read_text()
          report = json.loads(Path("/tmp/cfb-report.json").read_text())
          assert "<div id=\"root\"></div>" in html or 'id="root"' in html, "Missing React mount"
          from html.parser import HTMLParser
          class Assets(HTMLParser):
            def __init__(self):
              super().__init__()
              self.scripts = []
            def handle_starttag(self, tag, attrs):
              fields = dict(attrs)
              if tag == "script" and fields.get("type") == "module" and fields.get("src"):
                self.scripts.append(fields["src"])
          assets = Assets()
          assets.feed(html)
          assert assets.scripts, "Published dashboard has no JavaScript entrypoint"
          Path("/tmp/cfb-script-path.txt").write_text(assets.scripts[0])
          assert report["season"] == 2026 and report["rankings"] and report["predictions"]
          if "DEMO" not in (report.get("source") or ""):
            assert report.get("retrieved_at"), "Published live report has no retrieval timestamp"
          backtest = json.loads(Path("/tmp/cfb-backtest.json").read_text())
          assert backtest["games"] > 0, "Published backtest has no evaluated games"
          assert sum(row["games"] for row in backtest["weekly_coverage"]) == backtest["games"]
          accuracy = report.get("prediction_accuracy")
          if accuracy is not None:
            assert isinstance(accuracy["games_evaluated"], int) and accuracy["games_evaluated"] >= 0
            assert 0 <= accuracy["correct_winners"] <= accuracy["games_evaluated"]
          print("Published dashboard and season report are reachable")
          PY
              script_path="$(cat /tmp/cfb-script-path.txt)"
              case "$script_path" in
                https://*) script_url="$script_path" ;;
                /*) script_url="https://landrumc16.github.io$script_path" ;;
                *) script_url="${base}$script_path" ;;
              esac
              curl --fail --location --silent --show-error "$script_url" -o /tmp/cfb-bundle.js
              test -s /tmp/cfb-bundle.js
              exit 0
            fi
            sleep 10
          done
          echo "Published dashboard smoke test failed" >&2
          exit 1

