name: Build and publish analytics dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'data/season-*-report.json'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build frozen-data demo if live report absent
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
          if [ ! -f data/season-2026-report.json ]; then
            python -m cfb_analytics.demo
          fi
          test -f data/season-2026-report.json || test -s web/public/season-report.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Include and validate published season report
        run: |
          if [ -f data/season-2026-report.json ]; then
            cp data/season-2026-report.json web/dist/season-report.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("web/dist/season-report.json").read_text())
          assert report["summary"]["teams"] == len(report["rankings"])
          assert report["summary"]["upcoming_games"] == len(report["predictions"])
          assert report["rankings"] and report["predictions"]
          assert report["cfp"]["simulations"] == 10000
          assert report["cfp"]["scenario"] == "current_model_probabilities"
          assert len(report["cfp"]["teams"]) == report["summary"]["teams"]
          assert len(report["projected_bracket"]["seeds"]) == 12
          assert len(report["projected_bracket"]["first_round"]) == 4
          assert sum(seed["bye"] for seed in report["projected_bracket"]["seeds"]) == 4
          assert report["conference_standings"]
          assert report["conference_strength"]
          assert Path("web/dist/index.html").is_file()
          print("Validated published dashboard and report")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
