name: Build and publish analytics dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh college football data']
    types: [completed]
    branches: [main]
  push:
    branches: [main, v2-development, v3.3-development]
    paths:
      - 'data/v2-research-summary.json'
      - 'docs/V3-EXECUTION-CHECKLIST.md'
      - 'docs/V3.2-MODEL-DECISION.md'
      - 'docs/V2-RELEASE-GATE.md'
      - 'web/**'
      - '.github/workflows/v3-historical-research.yml'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'data/season-*-report.json'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  v33-preview:
    if: github.ref == 'refs/heads/v3.3-development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate model and research safeguards
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          if [ ! -f data/season-2026-report.json ]; then python -m cfb_analytics.demo; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile V3.3 dashboard preview
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Stage preview report for browser smoke
        run: |
          if [ -f data/season-2026-report.json ]; then cp data/season-2026-report.json web/dist/season-report.json; fi
          test -s web/dist/season-report.json
      - name: Mobile and browser regression smoke
        run: |
          cd web
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          cd ..
          node web/tests/mobile-smoke.mjs
      - name: Upload browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v33-mobile-browser-evidence
          path: web/mobile-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify preview artifact
        run: |
          test -s web/dist/index.html
          if [ -f data/season-2026-report.json ]; then cp data/season-2026-report.json web/dist/season-report.json; fi
          test -s web/dist/season-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('web/dist/season-report.json').read_text())
          assert isinstance(report.get('rankings'), list) and report['rankings'], 'Missing rankings'
          assert all(isinstance(row.get('ranking_explanation'), dict) and abs(row['ranking_explanation']['score'] - row['rank_score']) < 1e-10 for row in report['rankings']), 'Ranking explanations missing or inconsistent'
          assert isinstance(report.get('predictions'), list) and report['predictions'], 'Missing predictions'
          print('V3.3 season report includes rankings and predictions')
          PY
          echo 'V3.3 frontend and baseline report compiled successfully'
  v2-preview:
    if: github.ref == 'refs/heads/v2-development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build V2 dashboard
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Verify optional V2 research data and compiled dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/v2-research-summary.json').read_text())
          assert data['type'] == 'retrospective_walk_forward_baseline'
          assert data['overall']['games'] == 3174
          assert sum(x['games'] for x in data['by_season'].values()) == 3174
          assert all(0 <= x['accuracy'] <= 1 for x in data['by_season'].values())
          assert Path('web/dist/index.html').is_file()
          Path('web/dist/v2-research-summary.json').write_text(json.dumps(data))
          assert json.loads(Path('web/dist/v2-research-summary.json').read_text()) == data
          print('V2 research dashboard build and summary smoke verified')
          PY
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build frozen-data demo if live report absent
        run: |
          python -m pip install -e '.[dev]'
          PYTHONPATH=. python -m pytest -q
          if [ ! -f data/season-2026-report.json ]; then
            python -m cfb_analytics.demo
          fi
          test -f data/season-2026-report.json || test -s web/public/season-report.json
      - name: Execute historical prediction backtest
        run: |
          python -m cfb_analytics.backtest --output historical-backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("historical-backtest.json").read_text())
          assert result["games"] > 0, "No historical games evaluated"
          for label in ("model", "preseason_baseline"):
              scores = result[label]
              assert 0 <= scores["winner_accuracy"] <= 1, label
              assert 0 <= scores["brier_score"] <= 1, label
              assert scores["log_loss"] >= 0, label
          assert sum(row["games"] for row in result["weekly_diagnostics"]) == result["games"]
          groups = result["matchup_diagnostics"]
          assert set(groups) == {"fbs_fbs", "fbs_fcs"}
          assert sum(group["games"] for group in groups.values()) == result["games"]
          for label in ("model", "preseason_baseline"):
              weighted = sum(group["games"] * group[label]["brier_score"]
                             for group in groups.values() if group["games"])
              assert abs(weighted / result["games"] - result[label]["brier_score"]) < 1e-10
          print("Historical games evaluated:", result["games"])
          print("Model:", result["model"])
          print("Preseason baseline:", result["preseason_baseline"])
          PY
      - name: Upload historical backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-results
          path: historical-backtest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Spreadsheet numerical parity audit (diagnostic)
        run: |
          # Keep an auditable discrepancy report without blocking the dashboard
          # until the frozen week-7 baseline has been reconciled.
          set -o pipefail
          if python -m cfb_analytics.parity --strict --tolerance 0.001 2>&1 | tee parity-report.txt; then
            echo "Spreadsheet numerical parity passed."
          else
            echo "::warning::Spreadsheet numerical parity is not yet verified; see parity-report artifact."
          fi
      - name: Upload spreadsheet parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spreadsheet-parity-report
          path: parity-report.txt
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Publish historical backtest evidence
        run: |
          test -s historical-backtest.json
          cp historical-backtest.json web/dist/historical-backtest.json
      - name: Include optional V2 multi-season research evidence
        run: |
          if [ -f data/v2-research-summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          source = Path("data/v2-research-summary.json")
          data = json.loads(source.read_text())
          assert data["type"] == "retrospective_walk_forward_baseline"
          assert data["disclaimer"] and data["fcs_policy"]
          assert data["overall"]["games"] == sum(v["games"] for v in data["by_season"].values())
          assert all(0 <= v["accuracy"] <= 1 and 0 <= v["brier"] <= 1 for v in data["by_season"].values())
          Path("web/dist/v2-research-summary.json").write_text(json.dumps(data) + "\n")
          PY
          fi
      - name: Require V2 research summary in production build
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("web/dist/v2-research-summary.json")
          assert p.is_file(), "V2 research scorecard missing from deployment"
          data = json.loads(p.read_text())
          assert data["type"] == "retrospective_walk_forward_baseline"
          assert data["overall"]["games"] == 3174
          assert sum(v["games"] for v in data["by_season"].values()) == 3174
          print("V2 research summary included in production artifact")
          PY
      - name: Rebuild and verify V3.1 report from the checked-in live snapshot
        run: |
          if [ -f data/cfbd-2026-games.json ]; then
            python -m cfb_analytics.report --season 2026
            python - <<'PY'
          import json
          from pathlib import Path
          from cfb_analytics.pipeline import build_prediction_accuracy
          report = json.loads(Path('data/season-2026-report.json').read_text())
          snapshot = json.loads(Path('data/cfbd-2026-games.json').read_text())
          history = json.loads(Path('data/pregame-2026-history.json').read_text())
          eligible = {team['team'] for team in report['rankings']}
          expected = build_prediction_accuracy(snapshot, history, eligible_teams=eligible)
          assert report['prediction_accuracy'] == expected, 'Accuracy not computed from verified pregame history'
          assert report['data_freshness']['retrieved_at'] == snapshot['retrieved_at']
          assert len(expected['calibration']) == 5
          print(f"V3.1 verified pregame evaluation: {expected['games_evaluated']} games")
          PY
          fi
      - name: Include and validate published season report
        run: |
          if [ -f data/season-2026-report.json ]; then
            cp data/season-2026-report.json web/dist/season-report.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("web/dist/season-report.json").read_text())
          assert report["season"] == 2026, "Only the 2026 season is supported"
          metadata = report.get("model_metadata")
          assert metadata and metadata["model_id"] == "workbook_2026_baseline", "V3 model provenance missing"
          assert metadata["model_status"] == "incumbent_not_v3_promoted"
          assert metadata["prediction_scale"] > 0 and metadata["home_field_advantage"] >= 0
          assert report["summary"]["completed_games"] >= 0
          assert report["summary"]["upcoming_games"] >= 0
          assert report["summary"]["teams"] == len(report["rankings"])
          assert report["summary"]["upcoming_games"] == len(report["predictions"])
          assert report["rankings"] and report["predictions"]
          if "DEMO" not in (report.get("source") or ""):
            from datetime import datetime, timezone
            generated = report.get("generated_at")
            assert generated, "Live report missing forecast generation timestamp"
            generated_time = datetime.fromisoformat(generated.replace("Z", "+00:00"))
            assert generated_time.tzinfo is not None, "Generation timestamp must be timezone-aware"
            retrieved_time = datetime.fromisoformat(report["retrieved_at"].replace("Z", "+00:00"))
            assert generated_time >= retrieved_time, "Forecast generated before its source snapshot"

          if "schedule" in report:
            ids = {g["game_id"] for g in report["schedule"]}
            assert len(ids) == len(report["schedule"]), "Duplicate schedule games"
            # The school schedule is FBS-filtered; predictions also include games outside that subset.
          assert all("game_id" in p for p in report["predictions"]), "Forecast missing game ID"
          if "performance" in report:
            assert len(report["performance"]) == report["summary"]["teams"]
            for team, row in report["performance"].items():
              assert row["games_with_forecasts"] >= 0, team
              if row["games_with_forecasts"] == 0:
                assert row["wins_above_expected"] is None, team
              else:
                assert 0 <= row["expected_wins"] <= row["games_with_forecasts"], team
          # Never silently label a frozen fixture as a current CFBD report.
          source = report.get("source") or ""
          assert source, "Report source must be identified"
          if "${{ github.event_name }}" == "workflow_run":
            assert "DEMO" not in source, "A successful live refresh must not deploy demo data"
          if "DEMO" not in source:
            from datetime import datetime
            assert "collegefootballdata.com" in source, "Unknown live report source"
            retrieved_at = report.get("retrieved_at")
            assert retrieved_at, "Live report requires retrieval timestamp"
            from datetime import timezone, timedelta
            updated = datetime.fromisoformat(retrieved_at.replace("Z", "+00:00"))
            assert updated.tzinfo is not None, "Live report timestamp must include timezone"
            age = datetime.now(timezone.utc) - updated.astimezone(timezone.utc)
            assert -timedelta(hours=1) <= age <= timedelta(hours=72), (
              f"Live report is stale or future-dated: {retrieved_at}"
            )
          assert report["cfp"]["simulations"] == 10000
          assert report["cfp"]["scenario"] == "current_model_probabilities"
          assert len(report["cfp"]["teams"]) == report["summary"]["teams"]
          assert len(report["projected_bracket"]["seeds"]) == 12
          assert len(report["projected_bracket"]["first_round"]) == 4
          assert sum(seed["bye"] for seed in report["projected_bracket"]["seeds"]) == 4
          assert report["conference_standings"]
          assert report["conference_strength"]
          assert all("most_likely_seed" in team for team in report["cfp"]["teams"])
          assert all("average_seed_when_selected" in team for team in report["cfp"]["teams"])
          # Verify published accuracy against completed games and the actual
          # archived forecasts, rather than trusting a count upper bound.
          snapshot_file = Path("data/cfbd-2026-games.json")
          history_file = Path("data/pregame-2026-history.json")
          if snapshot_file.exists() and history_file.exists():
            from cfb_analytics.pipeline import build_prediction_accuracy
            snapshot = json.loads(snapshot_file.read_text())
            history = json.loads(history_file.read_text())
            eligible = {row["team"] for row in report["rankings"]}
            expected_accuracy = build_prediction_accuracy(snapshot, history, eligible_teams=eligible)
            assert report.get("prediction_accuracy") == expected_accuracy, (
              "Published accuracy differs from eligible completed FBS forecasts"
            )
          if "prediction_accuracy" in report:
            accuracy = report["prediction_accuracy"]
            assert isinstance(accuracy["games_evaluated"], int) and accuracy["games_evaluated"] >= 0
            assert 0 <= accuracy["correct_winners"] <= accuracy["games_evaluated"]
            if accuracy["games_evaluated"]:
              assert 0 <= accuracy["winner_accuracy"] <= 1
              assert 0 <= accuracy["brier_score"] <= 1
            else:
              assert accuracy["winner_accuracy"] is None and accuracy["brier_score"] is None
          backtest = json.loads(Path("web/dist/historical-backtest.json").read_text())
          assert backtest["games"] > 0
          assert sum(row["games"] for row in backtest["weekly_coverage"]) == backtest["games"]
          assert backtest["evaluation_scope"].startswith("2026 frozen")
          assert Path("web/dist/index.html").is_file()
          bundles = list(Path("web/dist/assets").glob("*.js"))
          assert bundles and any(b"VERSION 3.2" in p.read_bytes() for p in bundles), "Version 3.2 dashboard bundle missing"
          print("Validated published dashboard and report")
          PY
      - name: Preserve V2 research summary for deployment verification
        uses: actions/upload-artifact@v4
        with:
          name: validated-v2-research-summary
          path: web/dist/v2-research-summary.json
          if-no-files-found: error
      - name: Preserve validated report for deployment verification
        uses: actions/upload-artifact@v4
        with:
          name: validated-season-report
          path: web/dist/season-report.json
          if-no-files-found: error
      - name: Browser smoke at mobile widths
        timeout-minutes: 8
        run: |
          cd web
          npm install --no-save playwright
          npx playwright install chromium
          cd ..
          node web/tests/mobile-smoke.mjs
      - name: Preserve mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-evidence
          path: web/mobile-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Retrieve validated report
        uses: actions/download-artifact@v4
        with:
          name: validated-season-report
          path: /tmp/cfb-validated
      - name: Retrieve validated V2 research summary
        uses: actions/download-artifact@v4
        with:
          name: validated-v2-research-summary
          path: /tmp/cfb-v2-validated
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published dashboard
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error "$base" -o /tmp/cfb-index.html && \
               curl --fail --location --silent --show-error "${base}season-report.json" -o /tmp/cfb-report.json && \
               curl --fail --location --silent --show-error "${base}historical-backtest.json" -o /tmp/cfb-backtest.json && \
               curl --fail --location --silent --show-error "${base}v2-research-summary.json" -o /tmp/cfb-v2.json; then
              python - <<'PY'
          import json
          from pathlib import Path
          html = Path("/tmp/cfb-index.html").read_text()
          report = json.loads(Path("/tmp/cfb-report.json").read_text())
          assert "<div id=\"root\"></div>" in html or 'id="root"' in html, "Missing React mount"
          from html.parser import HTMLParser
          class Assets(HTMLParser):
            def __init__(self):
              super().__init__()
              self.scripts = []
            def handle_starttag(self, tag, attrs):
              fields = dict(attrs)
              if tag == "script" and fields.get("type") == "module" and fields.get("src"):
                self.scripts.append(fields["src"])
          assets = Assets()
          assets.feed(html)
          assert assets.scripts, "Published dashboard has no JavaScript entrypoint"
          Path("/tmp/cfb-script-path.txt").write_text(assets.scripts[0])
          assert report["season"] == 2026 and report["rankings"] and report["predictions"]
          assert report["model_metadata"]["model_id"] == "workbook_2026_baseline", "V3 provenance absent from live dashboard"
          assert report["model_metadata"]["model_status"] == "incumbent_not_v3_promoted"
          # The deployed JSON must match the artifact built from the checked-in
          # snapshot; a successful HTTP 200 is not sufficient.
          import hashlib
          built = Path("/tmp/cfb-validated/season-report.json").read_bytes()
          deployed = Path("/tmp/cfb-report.json").read_bytes()
          assert hashlib.sha256(built).digest() == hashlib.sha256(deployed).digest(), (
            "Deployed report differs from the validated build artifact"
          )
          from datetime import datetime, timezone, timedelta
          if "DEMO" not in (report.get("source") or ""):
            updated = datetime.fromisoformat(report["retrieved_at"].replace("Z", "+00:00"))
            assert updated.tzinfo is not None, "Published live report timestamp lacks timezone"
            age = datetime.now(timezone.utc) - updated.astimezone(timezone.utc)
            assert -timedelta(hours=1) <= age <= timedelta(hours=72), (
              "Deployed live report is stale or future-dated"
            )
          source = report.get("source") or ""
          assert source, "Published report has no source"
          if "DEMO" not in source:
            assert "collegefootballdata.com" in source, "Unexpected published live source"
            assert report.get("retrieved_at"), "Published live report has no retrieval timestamp"
          v2 = json.loads(Path("/tmp/cfb-v2.json").read_text())
          assert v2["type"] == "retrospective_walk_forward_baseline"
          assert v2["overall"]["games"] == 3174
          assert sum(x["games"] for x in v2["by_season"].values()) == 3174
          v2_built = Path("/tmp/cfb-v2-validated/v2-research-summary.json").read_bytes()
          v2_deployed = Path("/tmp/cfb-v2.json").read_bytes()
          assert hashlib.sha256(v2_built).digest() == hashlib.sha256(v2_deployed).digest(), (
            "Published V2 research differs from validated artifact"
          )
          backtest = json.loads(Path("/tmp/cfb-backtest.json").read_text())
          assert backtest["games"] > 0, "Published backtest has no evaluated games"
          assert sum(row["games"] for row in backtest["weekly_coverage"]) == backtest["games"]
          accuracy = report.get("prediction_accuracy")
          if accuracy is not None:
            assert isinstance(accuracy["games_evaluated"], int) and accuracy["games_evaluated"] >= 0
            assert 0 <= accuracy["correct_winners"] <= accuracy["games_evaluated"]
            assert "log_loss" in accuracy and "calibration" in accuracy, "V3.1 accuracy missing"
            assert "forecast_coverage" in accuracy, "V3.1 forecast coverage missing"
            assert len(accuracy["calibration"]) == 5, "V3.1 calibration bins missing"
          assert report.get("data_freshness", {}).get("retrieved_at") == report.get("retrieved_at"), (
            "V3.1 freshness provenance missing from deployed report"
          )
          print("Published dashboard and season report are reachable")
          PY
              script_url="$(python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urljoin
          base = os.environ["PAGE_URL"].rstrip("/") + "/"
          print(urljoin(base, Path("/tmp/cfb-script-path.txt").read_text().strip()))
          PY
              )"
              if curl --fail --location --silent --show-error "$script_url" -o /tmp/cfb-bundle.js && test -s /tmp/cfb-bundle.js; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Published dashboard smoke test failed" >&2
          exit 1

