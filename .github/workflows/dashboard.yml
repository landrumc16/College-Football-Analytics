name: Build and publish analytics dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/season-*-report.json'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build frozen-data demo if live report absent
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
          if [ ! -f data/season-2026-report.json ]; then
            python -m cfb_analytics.demo
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Include season report
        run: |
          if [ -f data/season-2026-report.json ]; then
            cp data/season-2026-report.json web/dist/season-report.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
