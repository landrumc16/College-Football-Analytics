name: Dynamic Team Strength Research Checks

on:
  pull_request:
    paths:
      - 'src/cfb_analytics/recency*'
      - 'src/cfb_analytics/lineup_advisory_research.py'
      - 'tests/test_recency*'
      - 'tests/test_lineup_advisory_research.py'
      - '.github/workflows/dynamic-team-strength-research.yml'
  workflow_dispatch:

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and pytest
        run: python -m pip install -e '.[dev]'
      - name: Run focused research tests
        run: python -m pytest -q tests/test_recency_research.py tests/test_recency_rating_research.py tests/test_recency_replay_research.py tests/test_lineup_advisory_research.py
      - name: Run existing rating and pipeline regression tests
        run: python -m pytest -q tests/test_pipeline.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Build frontend with TypeScript checks
        run: npm run build --prefix web
