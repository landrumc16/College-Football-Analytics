name: V3.4 historical recruiting research

on:
  push:
    branches: [v3.4-development]
    paths:
      - '.github/workflows/v34-historical-recruiting.yml'
      - 'src/cfb_analytics/v34_historical_snapshot_cli.py'
  workflow_dispatch:
    inputs:
      start:
        description: First completed season
        required: true
        default: '2016'
      end:
        description: Last completed season
        required: true
        default: '2025'

permissions:
  contents: read

jobs:
  historical-recruiting:
    if: github.ref == 'refs/heads/v3.4-development'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Collect completed-season historical inputs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          START: ${{ inputs.start || '2016' }}
          END: ${{ inputs.end || '2025' }}
        run: python -m cfb_analytics.v34_historical_snapshot_cli --start "$START" --end "$END" --output /tmp/v34-historical-input.json
      - name: Evaluate historical recruiting baseline
        run: python -m cfb_analytics.v34_recruiting_evaluation_cli --input /tmp/v34-historical-input.json --output /tmp/v34-recruiting-report.json
      - name: Print descriptive scorecard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/v34-recruiting-report.json').read_text())
          print(json.dumps({'joined_team_seasons': report['joined_team_seasons'],
                            'scorecard': report['scorecard'],
                            'historical_asof_verified': report['historical_asof_verified']}, indent=2))
          assert report['historical_asof_verified'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v34-historical-recruiting-research
          path: |
            /tmp/v34-historical-input.json
            /tmp/v34-recruiting-report.json
          retention-days: 30
