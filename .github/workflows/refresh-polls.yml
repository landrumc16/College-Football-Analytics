name: Refresh official college football polls

on:
  workflow_dispatch:
  schedule:
    # Poll publication windows, 15-minute intervals, UTC.
    - cron: '*/15 16-22 * 8-12 0'
    # Delayed AP releases can land on Monday after a rescheduled Sunday game.
    - cron: '*/15 16-23 * 8-12 1'
    - cron: '*/15 23 * 11-12 2'
    - cron: '*/15 0-5 * 11-12 3'

permissions:
  contents: write
  actions: write     # watch_keeper may restart the watcher chain (workflow_dispatch)
  issues: write      # freshness alert issue

concurrency:
  group: official-poll-refresh
  cancel-in-progress: false

env:
  CFBD_SHARED_QUOTA: github
  CFBD_ACQUISITION_LIMIT: '8'

jobs:
  polls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Poll verified published rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: PYTHONPATH=src python -m cfb_analytics.poll_refresh
      - name: Publish official CFP rankings when dated and independently confirmed
        # Only a dated official release that parses to ranks 1-25 and matches CFBD's committee poll for the same week
        # is published (with an evidence file). Anything else changes nothing and raises a warning.
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m cfb_analytics.cfp_publish
      - name: Commit only changed verified poll data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f data/poll-2026-snapshot.json ]; then
            echo 'No verified poll snapshot to publish yet.'
            exit 0
          fi
          git add data/poll-2026-snapshot.json
          git add docs/evidence/cfp-publication-*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified official poll snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Keep the event watcher running and report freshness problems
        # GitHub can start scheduled runs hours late, so every run of this workflow also restarts a stopped watcher
        # chain (never a second concurrent watcher) and runs one freshness monitor pass. No CFBD calls.
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m cfb_analytics.watch_keeper
