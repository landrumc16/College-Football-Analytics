name: V5 historical poll source acquisition

on:
  workflow_dispatch:
  push:
    branches: [v5-development]
    paths:
      - 'scripts/fetch_v5_historical_polls.py'
      - 'tests/test_v5_historical_polls.py'
      - 'scripts/build_v5_poll_history.py'
      - 'scripts/resolve_v5_espn_team_ids.py'
      - 'tests/test_v5_espn_identity_resolution.py'
      - 'tests/test_v5_poll_history.py'
      - 'research/v5-cohort-espn-team-ids.json'
      - '.github/workflows/v5-historical-polls.yml'

permissions:
  contents: read

jobs:
  polls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and validate poll parsing
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_v5_historical_polls.py tests/test_v5_poll_history.py tests/test_v5_espn_identity_resolution.py
      - name: Fetch genuine AP and Coaches snapshots for 2016-2025
        run: python scripts/fetch_v5_historical_polls.py --output historical-polls
      - name: Convert validated snapshots into research-only cohort history
        run: |
          python -m scripts.build_v5_poll_history \
            --snapshots historical-polls \
            --team-ids research/v5-cohort-espn-team-ids.json \
            --output historical-polls/cohort-poll-history.json
      - name: Retrieve ESPN directory and generate national ID candidate evidence
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          from pathlib import Path
          from scripts.resolve_v5_espn_team_ids import DIRECTORY_URL, candidate_mapping
          root = Path("historical-polls")
          snapshots = [json.loads((root / f"poll_snapshots_{year}.json").read_text()) for year in range(2016, 2026)]
          cohort = json.loads(Path("research/v5-cohort-espn-team-ids.json").read_text())
          with urlopen(DIRECTORY_URL, timeout=30) as response:
              directory = json.load(response)
          (root / "espn-directory-source.json").write_text(json.dumps(directory, indent=2) + chr(10))
          result = candidate_mapping(snapshots, directory, cohort)
          (root / "national-identity-candidates.json").write_text(json.dumps(result, indent=2) + chr(10))
          print("Ranked IDs:", result["ranked_ids"], "Candidates:", result["resolved_candidates"])
          print("Unresolved IDs:", result["unresolved_ids"])
          print("Publication remains gated on independent review.")
          PY
      - name: Check national candidate mapping against ranked poll IDs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("historical-polls")
          candidates = json.loads((root / "national-identity-candidates.json").read_text())
          assert candidates["status"] == "candidate_only_requires_independent_identity_review"
          assert candidates["publishable"] is False
          assert candidates["ranked_ids"] >= 25
          assert candidates["resolved_candidates"] <= candidates["ranked_ids"]
          assert len(candidates["mapping"]) == candidates["resolved_candidates"]
          assert len(candidates["unresolved_ids"]) + candidates["resolved_candidates"] == candidates["ranked_ids"]
          print(f"Candidate IDs: {candidates['resolved_candidates']}/{candidates['ranked_ids']}")
          PY
      - name: Upload raw polls, snapshot extracts and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-historical-poll-sources
          path: historical-polls/
          if-no-files-found: warn
          retention-days: 30
