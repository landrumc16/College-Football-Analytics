name: V5 historical poll source acquisition

on:
  workflow_dispatch:
  push:
    branches: [v5-development]
    paths:
      - 'scripts/fetch_v5_historical_polls.py'
      - 'tests/test_v5_historical_polls.py'
      - 'scripts/build_v5_poll_history.py'
      - 'tests/test_v5_poll_history.py'
      - '.github/workflows/v5-historical-polls.yml'

permissions:
  contents: read

jobs:
  polls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and validate poll parsing
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_v5_historical_polls.py tests/test_v5_poll_history.py
      - name: Fetch genuine AP and Coaches snapshots for 2016-2025
        run: python scripts/fetch_v5_historical_polls.py --output historical-polls
      - name: Upload raw polls, snapshot extracts and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-historical-poll-sources
          path: historical-polls/
          if-no-files-found: warn
          retention-days: 30
