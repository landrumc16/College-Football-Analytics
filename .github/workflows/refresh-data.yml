name: Refresh college football data

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-data.yml']
  workflow_dispatch:
    inputs:
      season:
        description: Season to refresh
        required: true
        default: '2026'
  schedule:
    - cron: '23 11 * * *' # Daily baseline (UTC)
    # Every 15 minutes during US game hours, August-January. The gate checks
    # for newly final games and skips full refreshes if none have completed.
    - cron: '*/15 16-23 * 8-12 *'
    - cron: '*/15 0-6 * 8-12 *'
    - cron: '*/15 16-23 * 1 *'
    - cron: '*/15 0-6 * 1 *'

permissions:
  contents: write

# A second refresh must not overwrite a newer immutable forecast ledger.
concurrency:
  group: cfb-2026-refresh
  cancel-in-progress: false

jobs:
  game_day_gate:
    runs-on: ubuntu-latest
    outputs:
      run_refresh: ${{ steps.decide.outputs.run_refresh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: PYTHONPATH=src python -m cfb_analytics.game_completion_gate
  refresh:
    needs: game_day_gate
    if: needs.game_day_gate.outputs.run_refresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Reject unsupported season before refresh
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: |
          if [ "$SEASON" != "2026" ]; then
            echo "Only the 2026 season is supported until season-specific priors are implemented." >&2
            exit 1
          fi
      - name: Refresh validated CFBD snapshot
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python -m cfb_analytics.refresh --season "$SEASON"
      - name: Refresh 2026 recruiting research snapshot (development branch only)
        if: github.ref == 'refs/heads/v3.4-development'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m cfb_analytics.v34_recruiting_refresh --year 2026
      - name: Verify live kickoff timestamps are available
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          snapshot = json.loads(Path("data/cfbd-2026-games.json").read_text())
          games = snapshot["games"]
          pending = [g for g in games if not g["completed"]]
          valid = 0
          for game in pending:
              value = game.get("start_date")
              if not value:
                  continue
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  continue
              valid += parsed.tzinfo is not None
          assert not pending or valid > 0, (
              "Upcoming games lack timezone-aware kickoff timestamps; "
              "refusing to publish forecasts without pregame provenance"
          )
          print(f"Upcoming games with verifiable kickoff: {valid}/{len(pending)}")
          PY
      - name: Build season rankings and predictions
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python -m cfb_analytics.report --season "$SEASON"
      - name: Verify archived forecast provenance and accuracy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cfb_analytics.forecast_ledger import aware_utc
          snapshot = json.loads(Path('data/cfbd-2026-games.json').read_text())
          report = json.loads(Path('data/season-2026-report.json').read_text())
          history = json.loads(Path('data/pregame-2026-history.json').read_text())
          assert report['season'] == snapshot['season'] == 2026
          assert report['retrieved_at'] == snapshot['retrieved_at']
          assert report['data_freshness']['retrieved_at'] == snapshot['retrieved_at']
          verified = 0
          for game_id, forecast in history.items():
              # Legacy entries lack source/kickoff provenance and are excluded
              # from V3.1 accuracy, not silently promoted to verified forecasts.
              if forecast.get('source') == 'previously_published_forecast' and not forecast.get('source_retrieved_at'):
                  continue
              source_time = aware_utc(forecast.get('source_retrieved_at'))
              forecast_time = aware_utc(forecast.get('forecast_recorded_at'))
              kickoff_time = aware_utc(forecast.get('scheduled_kickoff_at'))
              assert all((source_time, forecast_time, kickoff_time)), game_id
              assert source_time <= forecast_time < kickoff_time, game_id
              verified += 1
          accuracy = report['prediction_accuracy']
          assert accuracy['games_evaluated'] <= accuracy['eligible_completed_games']
          assert len(accuracy['calibration']) == 5
          print(f"Verified {len(history)} immutable pregame forecasts")
          PY
      - name: Commit changed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cfbd-*-games.json data/season-*-report.json data/pregame-*-history.json
          if [ "$GITHUB_REF" = "refs/heads/v3.4-development" ]; then
            git add data/cfbd-recruiting-*.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CFBD season snapshot"
            git push
          fi
