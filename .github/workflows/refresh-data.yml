name: Refresh college football data

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-data.yml']
  workflow_dispatch:
    inputs:
      rapid_only:
        description: Publish the authorized rapid inbox without CFBD acquisition
        type: boolean
        default: false
      essential_only:
        description: Publish essential results without optional market acquisition
        type: boolean
        default: false
      season:
        description: Season to refresh
        required: true
        default: '2026'
  schedule:
    - cron: '23 11 * * *' # Daily baseline (UTC): full reconciliation even if no event was detected.
    # Game-day freshness comes from the event watcher (event-watcher.yml), which dispatches this workflow when a game
    # becomes final and paces CFBD calls to the monthly quota. The former 15-minute game-hour crons were removed:
    # GitHub ran them only every 3-4 hours, and each gate check spent a CFBD call (free tier: 1,000 a month).

permissions:
  contents: write
  actions: write     # watch_keeper may restart the watcher chain (workflow_dispatch)
  issues: write      # freshness alert issue

# A second refresh must not overwrite a newer immutable forecast ledger.
concurrency:
  group: cfb-2026-refresh
  cancel-in-progress: false

env:
  CFBD_SHARED_QUOTA: github
  CFBD_ACQUISITION_LIMIT: '8'

jobs:
  game_day_gate:
    if: inputs.rapid_only != true
    runs-on: ubuntu-latest
    outputs:
      run_refresh: ${{ steps.decide.outputs.run_refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # reruns must read current retained data, not the original triggering SHA
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m cfb_analytics.game_completion_gate
  refresh:
    needs: game_day_gate
    if: needs.game_day_gate.outputs.run_refresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # preserve current immutable archives before rebuilding and publishing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Reject unsupported season before refresh
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: |
          if [ "$SEASON" != "2026" ]; then
            echo "Only the 2026 season is supported until season-specific priors are implemented." >&2
            exit 1
          fi
      - name: Refresh validated CFBD snapshot
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python -m cfb_analytics.refresh --season "$SEASON"
      - name: Refresh 2026 recruiting research snapshot (development branch only)
        if: github.ref == 'refs/heads/v3.4-development'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m cfb_analytics.v34_recruiting_refresh --year 2026
      - name: Verify live kickoff timestamps are available
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          snapshot = json.loads(Path("data/cfbd-2026-games.json").read_text())
          games = snapshot["games"]
          pending = [g for g in games if not g["completed"]]
          valid = 0
          for game in pending:
              value = game.get("start_date")
              if not value:
                  continue
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  continue
              valid += parsed.tzinfo is not None
          assert not pending or valid > 0, (
              "Upcoming games lack timezone-aware kickoff timestamps; "
              "refusing to publish forecasts without pregame provenance"
          )
          print(f"Upcoming games with verifiable kickoff: {valid}/{len(pending)}")
          PY
      - name: Build season rankings and predictions
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python -m cfb_analytics.report --season "$SEASON"
      - name: Reconcile rapid results from the already retrieved CFBD snapshot
        if: hashFiles('operations/rapid-state.json') != ''
        run: |
          python - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          if json.loads(Path('operations/rapid-sources.json').read_text()).get('enabled') is True:
              subprocess.run(['python', '-m', 'cfb_analytics.rapid_results_cli',
                  '--inbox', 'operations/rapid-inbox.json', '--schedule', 'data/season-2026-report.json',
                  '--sources', 'operations/rapid-sources.json', '--state', 'operations/rapid-state.json',
                  '--output', 'web/public/fast-results.json', '--archive', 'research/archive/rapid-confirmed',
                  '--cfbd-snapshot', 'data/cfbd-2026-games.json'], check=True)
          PYCODE
      - name: Refresh dual projections from retained inputs without changing models
        continue-on-error: true
        run: |
          python -m cfb_analytics.dual_publish --out /tmp/v9-dual-projections.json
          cp /tmp/v9-dual-projections.json web/public/dual-projections.json
      - name: Retain V9 issued forecasts and strength observation offline
        # Evidence archiving must never block publication of scores and rankings; a failure is reported as a warning
        # and the next refresh retries (first observations are never rewritten).
        continue-on-error: true
        run: |
          python -m scripts.v9_accountability --retain --output /tmp/v9-accountability.json
          python scripts/v9_strength_snapshot.py --report data/season-2026-report.json --archive docs/evidence/v9/strength-history --source-commit "$(git rev-parse HEAD)"
      - name: Rebuild reviewed V5 Report Cards from retained history and refreshed incumbent ratings
        run: PYTHONPATH=src python -m scripts.reconcile_v5_historical_sources
      - name: Verify archived forecast provenance and accuracy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cfb_analytics.forecast_ledger import aware_utc
          snapshot = json.loads(Path('data/cfbd-2026-games.json').read_text())
          report = json.loads(Path('data/season-2026-report.json').read_text())
          history = json.loads(Path('data/pregame-2026-history.json').read_text())
          assert report['season'] == snapshot['season'] == 2026
          assert report['retrieved_at'] == snapshot['retrieved_at']
          assert report['data_freshness']['retrieved_at'] == snapshot['retrieved_at']
          verified = 0
          for game_id, forecast in history.items():
              # Legacy entries lack source/kickoff provenance and are excluded
              # from V3.1 accuracy, not silently promoted to verified forecasts.
              if forecast.get('source') == 'previously_published_forecast' and not forecast.get('source_retrieved_at'):
                  continue
              source_time = aware_utc(forecast.get('source_retrieved_at'))
              forecast_time = aware_utc(forecast.get('forecast_recorded_at'))
              kickoff_time = aware_utc(forecast.get('scheduled_kickoff_at'))
              assert all((source_time, forecast_time, kickoff_time)), game_id
              assert source_time <= forecast_time < kickoff_time, game_id
              verified += 1
          accuracy = report['prediction_accuracy']
          assert accuracy['games_evaluated'] <= accuracy['eligible_completed_games']
          assert len(accuracy['calibration']) == 5
          print(f"Verified {len(history)} immutable pregame forecasts")
          PY
      - name: Reserve quota for essential results before optional market retrieval
        id: optional_budget
        if: inputs.essential_only != true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/optional_source_budget.py
      - name: Refresh V7 current-season market statistics (isolated; failure keeps last verified archive)
        id: v7_market
        if: steps.optional_budget.outputs.allowed == 'true' && hashFiles('data/v7-market-receipts.json') != ''
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m cfb_analytics.v7_market_archive --season 2026 --cache "$RUNNER_TEMP/v7-private"
      - name: Report V7 market refresh failure without blocking football results
        if: steps.v7_market.outcome == 'failure'
        run: echo "::warning::V7 market refresh rejected; previous verified market archive retained"
      - name: Refresh V7 market metrics from the archive and forecast ledger (isolated; failure keeps last good)
        id: v7_metrics
        if: hashFiles('data/v7-market-receipts.json') != ''
        continue-on-error: true
        run: python -m cfb_analytics.v7_market_metrics
      - name: Report V7 metrics failure without blocking football results
        if: steps.v7_metrics.outcome == 'failure'
        run: echo "::warning::V7 market metrics rejected; previous metrics retained"
      - name: Refresh V7 historical validation from the updated archive (isolated; failure keeps last good)
        id: v7_validation
        if: steps.v7_metrics.outcome == 'success'
        continue-on-error: true
        run: python -m cfb_analytics.v7_validation
      - name: Refresh postseason games (conference championships filed as postseason, bowls, CFP)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m cfb_analytics.postseason
      - name: Validate exactly the data about to be published
        # Runs on the refreshed snapshot, report and derived files, so a bad refresh is never committed. The
        # dashboard build skips its duplicate run for this exact validated commit (see dashboard.yml).
        run: python -m pytest -q
      - name: Commit changed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cfbd-*-games.json data/season-*-report.json data/pregame-*-history.json
          git add docs/evidence/v9/pregame docs/evidence/v9/strength-history web/public/dual-projections.json
          git add data/cfbd-*-postseason.json web/public/postseason-*.json 2>/dev/null || true
          git add web/public/v5-program-report-cards.json web/public/v5-historical-results.json
          if [ -f data/v7-market-receipts.json ]; then
            git add data/v7-market-receipts.json web/public/v7-team-market-history.json web/public/v7-team-lines web/public/v7-market-metrics.json web/public/v7-model-market research/v7/historical-validation.json
          fi
          if [ "$GITHUB_REF" = "refs/heads/v3.4-development" ]; then
            git add data/cfbd-recruiting-*.json
          fi
          if [ -f operations/rapid-state.json ]; then
            git add operations/rapid-state.json web/public/fast-results.json
            if [ -d research/archive/rapid-confirmed ]; then git add research/archive/rapid-confirmed; fi
          fi
          bash scripts/publish_refresh_snapshot.sh
      - name: Keep the event watcher running and report freshness problems
        # GitHub can start scheduled runs hours late, so every run of this workflow also restarts a stopped watcher
        # chain (never a second concurrent watcher) and runs one freshness monitor pass. No CFBD calls.
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m cfb_analytics.watch_keeper

  rapid_publication:
    if: inputs.rapid_only == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Validate and publish licensed rapid observations without provider requests
        run: |
          python -m cfb_analytics.rapid_results_cli \
            --inbox operations/rapid-inbox.json --schedule data/season-2026-report.json \
            --sources operations/rapid-sources.json --state operations/rapid-state.json \
            --output web/public/fast-results.json --archive research/archive/rapid-confirmed
          python -m pytest -q tests/test_rapid_results.py tests/test_rapid_monitor.py
      - name: Commit rapid presentation state with existing concurrent-change protection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f operations/rapid-state.json ]; then
            git add operations/rapid-state.json web/public/fast-results.json
            if [ -d research/archive/rapid-confirmed ]; then git add research/archive/rapid-confirmed; fi
          fi
          bash scripts/publish_refresh_snapshot.sh
