name: Refresh college football data

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to refresh
        required: true
        default: '2026'
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Reject unsupported season before refresh
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: |
          if [ "$SEASON" != "2026" ]; then
            echo "Only the 2026 season is supported until season-specific priors are implemented." >&2
            exit 1
          fi
      - name: Refresh validated CFBD snapshot
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python -m cfb_analytics.refresh --season "$SEASON"
      - name: Verify live kickoff timestamps are available
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          snapshot = json.loads(Path("data/cfbd-2026-games.json").read_text())
          games = snapshot["games"]
          pending = [g for g in games if not g["completed"]]
          valid = 0
          for game in pending:
              value = game.get("start_date")
              if not value:
                  continue
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  continue
              valid += parsed.tzinfo is not None
          assert valid > 0, (
              "No upcoming games have timezone-aware kickoff timestamps; "
              "refusing to publish forecasts without pregame provenance"
          )
          print(f"Upcoming games with verifiable kickoff: {valid}/{len(pending)}")
          PY
      - name: Build season rankings and predictions
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python -m cfb_analytics.report --season "$SEASON"
      - name: Commit changed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cfbd-*-games.json data/season-*-report.json data/pregame-*-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CFBD season snapshot"
            git push
          fi
